name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Security audit (dependency vulnerability scan)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build Docker image (validates Dockerfile on every push)
        run: docker build -t car-rent-app-backend:${{ github.sha }} .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy backend on EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            APP_DIR=~/car-rent-app-backend

            # Remove existing project entirely
            rm -rf $APP_DIR

            # Clone a fresh copy
            git clone https://github.com/Chetanya2001/car-rent-app-backend.git $APP_DIR

            cd $APP_DIR

            # Write .env file from secret
            cat <<EOF > $APP_DIR/.env
            ${{ secrets.BACKEND_ENV_FILE }}
            EOF

            # Install dependencies
            npm install

            # Restart backend process managed by PM2
            pm2 restart server || pm2 start server.js --name server

            pm2 status
